version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cea_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cea_network

  nginx:
    image: nginx:1.27-alpine
    container_name: cea_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - cea_network

  db:
    image: postgres:16-alpine
    container_name: cea_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app_cea}
      POSTGRES_USER: ${DB_USERNAME:-app_cea}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cea_db_data:/var/lib/postgresql/data
      # Habilita la extensión btree_gist automáticamente al crear el contenedor,
      # necesaria para el constraint de exclusión anti-traslape de horarios.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app_cea} -d ${DB_DATABASE:-app_cea}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cea_network

  redis:
    image: redis:7-alpine
    container_name: cea_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - cea_network

networks:
  cea_network:
    driver: bridge

volumes:
  cea_db_data:
    driver: local
